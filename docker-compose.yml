services:
  garehabba:
    build: .
    ports:
      - "8137:8137"
    restart: unless-stopped
    environment:
      PORT: "8137"
      SCORES_FILE: /app/data/scores.json
    volumes:
      - garehabba-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8137/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  garehabba-data:
