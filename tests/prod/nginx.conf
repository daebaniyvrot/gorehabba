# Реплика боевого v1nce.conf: «Гарехабба» живёт под префиксом /fest за nginx.
# Файл монтируется в /etc/nginx/conf.d/default.conf сервиса proxy
# (tests/prod/docker-compose.prod-test.yml); upstream garehabba — имя сервиса.

server {
    listen 80;
    server_name _;

    # /fest без слэша → на /fest/ (как на проде).
    location = /fest {
        return 301 /fest/;
    }

    # WebSocket мультиплеера: без proxy_http_version 1.1 и Upgrade/Connection
    # через прокси не заведётся; таймауты длинные — игроки висят подолгу.
    location = /fest/ws {
        proxy_pass http://garehabba:8137/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    # Всё остальное под /fest/ → приложению; префикс срезается (proxy_pass с «/»).
    # X-Forwarded-For: nginx ДОПИСЫВАЕТ реальный адрес клиента последним hop'ом —
    # именно его читает сервер при TRUST_PROXY=1, подделать его клиент не может.
    location ^~ /fest/ {
        proxy_pass http://garehabba:8137/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
